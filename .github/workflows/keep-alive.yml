name: Mantener Supabase despierto

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SB_URL: https://hcdgwlvnpkduabgufnit.supabase.co
          SB_KEY: sb_publishable_O24KM-peZRdDo2SENY-uEg_g-Y_cJt5
        run: |
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SB_URL/rest/v1/listings?select=id&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY")
          echo "HTTP: $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no respondió OK (HTTP $code)."
            exit 1
          fi
          echo "Supabase activo."
